packages:
  - "apps/*"
  - "packages/*"

# Don't auto-install before running a script. pnpm v10+ otherwise tries to purge
# and reinstall node_modules before `pnpm <script>`, which aborts with no TTY in
# automation (the release build's `tauri build` → `pnpm vite:build`) and can even
# prune devDependencies mid-build. Deps are managed explicitly via `pnpm install`.
verifyDepsBeforeRun: false

allowBuilds:
  better-sqlite3: true
  esbuild: true
  # CLI Supabase : son postinstall télécharge le binaire de la plateforme.
  supabase: true

# Correctifs de sécurité sur des dépendances TRANSITIVES (`pnpm audit
# --audit-level=high`, alertes publiées depuis le 2026-10-17). Ici et non dans
# `package.json#pnpm` : pnpm 11 ne lit plus ce champ. Chaque entrée ne vise que
# les versions vulnérables et remonte au premier correctif de la MÊME majeure.
# Les dépendances directes, elles, sont montées dans leur package.json. Retirer
# une entrée dès que le paquet parent exige lui-même une version corrigée.
overrides:
  # imapflow > socks (agent, outil read_email) — socks épinglé par imapflow.
  "ip-address@>=10.0.0 <10.3.1": "^10.3.1"
  # jsdom 29 > undici (tests desktop) — jsdom 30 passe à undici 8.
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  # eslint > minimatch 3 (lint).
  "brace-expansion@<1.1.20": "^1.1.20"
  # rimraf > glob, typescript-eslint > minimatch récent (lint, outillage).
  "brace-expansion@>=5.0.0 <5.0.11": "^5.0.11"
  # eslint > @eslint/eslintrc (lint).
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  # @vitejs/plugin-react > @babel/core (build desktop).
  "browserslist@<4.28.7": "^4.28.7"
  # vite, @tailwindcss/postcss (build desktop) gardaient leur postcss à part,
  # alors que la dépendance directe du desktop est déjà montée.
  "postcss@>=8.0.0 <8.5.18": "^8.5.18"
  # postcss (build desktop).
  "nanoid@>=3.0.0 <3.3.18": "^3.3.18"
  # postcss, @tailwindcss/node, jsdom > css-tree (build et tests desktop).
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
