[package]
name = "catdesk"
version = "0.2.0"
description = "CatDesk — Local AI Desktop Copilot"
authors = ["alexis.bert1412"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "catdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
reqwest = { version = "0.12", features = ["json"] }

# Voix (mode « Jarvis », 2026-09) — tout sur CPU, jamais de VRAM : la RX 6700
# est déjà saturée par qwen3:14b. sherpa-onnx couvre VAD (Silero), STT
# (Parakeet TDT v3) et TTS (Piper) avec une seule dépendance ; cpal tient le
# micro et la sortie audio en natif, ce qui marche fenêtre cachée.
sherpa-onnx = "1.13"
cpal = "0.15"

# Job Object : arrêter Ollama AVEC ses runners llama-server (~9 Go de VRAM),
# y compris si CatDesk plante — core/process_tree.rs. Version déjà présente
# dans l'arbre de dépendances (tauri). Dictée (core/voice/dictation.rs) :
# frappes Unicode, fenêtre active, niveau d'intégrité de la cible.
# Fenêtres (core/desktop.rs) : EnumWindows, fenêtres masquées (DWM).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# UI Automation (core/desktop.rs) : interfaces COM, absentes de windows-sys.
# Crate Microsoft, MIT OR Apache-2.0, version déjà dans l'arbre (tauri/webview2).
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
