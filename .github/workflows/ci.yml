name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

jobs:
  # ─── TypeScript checks ──────────────────────────────────────
  typescript:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm lint

  # ─── Unit Tests ────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # ─── Rust backend (fmt + tests) ────────────────────────────
  # windows-latest : cible réelle de l'app, et Tauri n'y demande
  # aucune dépendance système (webkit requis sous Linux).
  rust:
    name: Rust Backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --tests -- -D warnings

      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  # ─── Python OCR sidecar ────────────────────────────────────
  python:
    name: Python Sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/ocr-vision/requirements.txt

      - working-directory: packages/ocr-vision
        run: |
          pip install -r requirements-dev.txt
          # Erreurs de syntaxe/imports sur tous les modules, puis tests.
          python -m compileall -q main.py vision ocr audio files
          python -m pytest -q

  # ─── Tauri Build (Windows only, on tags) ──────────────────
  build-tauri:
    name: Build Desktop App
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CatDesk ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](CHANGELOG.md) for changes.
          releaseDraft: true
          prerelease: false
          projectPath: apps/desktop
