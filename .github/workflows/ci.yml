name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

jobs:
  # ─── TypeScript checks ──────────────────────────────────────
  typescript:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm lint

      # `prettier --check .` (pas un glob) : sous Windows, l'ancien glob
      # `**/*.{ts,tsx,json,md}` ratait des fichiers et la porte passait à tort.
      - run: pnpm format:check

  # ─── Unit Tests ────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # ─── Rust backend (fmt + tests) ────────────────────────────
  # windows-latest : cible réelle de l'app, et Tauri n'y demande
  # aucune dépendance système (webkit requis sous Linux).
  rust:
    name: Rust Backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96'
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # sherpa-onnx-sys télécharge ses bibliothèques natives (~1,2 Go extraites)
      # dans target/sherpa-onnx-prebuilt, que rust-cache ne restaure pas en
      # entier : le dossier revient, les .lib extraites non. La sortie de son
      # build script, elle, survit — d'où « could not find native static
      # library sherpa-onnx-c-api » au premier `cargo test` qui recompile la
      # crate. Si la bibliothèque manque, on force le build script à se relancer
      # (il réextrait l'archive, ou la retélécharge).
      - name: Réparer le cache sherpa-onnx
        shell: bash
        run: |
          t=apps/desktop/src-tauri/target
          if ! ls "$t"/sherpa-onnx-prebuilt/*/lib/sherpa-onnx-c-api.lib >/dev/null 2>&1; then
            echo "Bibliothèques sherpa-onnx absentes du cache : build script relancé"
            rm -rf "$t"/debug/build/sherpa-onnx-sys-* "$t"/debug/.fingerprint/sherpa-onnx-sys-*
          fi

      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --tests -- -D warnings

      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  # ─── Python OCR sidecar ────────────────────────────────────
  python:
    name: Python Sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/ocr-vision/requirements.txt

      - working-directory: packages/ocr-vision
        run: |
          pip install -r requirements-dev.txt
          # Erreurs de syntaxe/imports sur tous les modules, puis tests.
          python -m compileall -q main.py vision ocr audio files
          python -m pytest -q

  # ─── Tauri Build (Windows only, on tags) ──────────────────
  build-tauri:
    name: Build Desktop App
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96'

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CatDesk ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](CHANGELOG.md) for changes.
          releaseDraft: true
          prerelease: false
          projectPath: apps/desktop
